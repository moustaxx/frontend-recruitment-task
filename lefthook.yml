pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{ts,tsx,js,jsx,json,css,md,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{ts,tsx,js,jsx}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
